[package]
name = "winshot"
version = "0.1.0"
edition = "2021"
description = "Fast Windows screenshots driven from WSL: per-display, per-window, per-process"
repository = "https://github.com/Aztec03hub/winshot"
license = "MIT"

# Windows-only by design: WSL has no access to the Windows desktop compositor,
# so the capture binary must be Windows-native. See docs/DESIGN.md §1.

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
fast_image_resize = "6"
png = "0.18"
image-webp = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-manifest = "1.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
